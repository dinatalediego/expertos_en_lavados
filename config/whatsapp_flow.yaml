version: '0.2'
brand: LimpiaFast
purpose: "calificar sin fricción y entregar contexto completo a la persona que cotiza"
entry_message: "👋 ¡Hola! Soy el asistente de LimpiaFast. Te ayudo a cotizar rápido y sin llamadas innecesarias."

states:
  - NEW_CHAT
  - QUALIFYING
  - QUALIFIED_PENDING_QUOTE
  - QUOTED
  - FOLLOW_UP
  - BOOKED
  - SERVICE_DONE
  - LOST
  - REPEAT_DUE

questions:
  - id: service_type
    prompt: "¿Qué quieres limpiar?"
    type: options
    required: true
    options:
      - "🛋️ Sofá / muebles"
      - "🛏️ Colchón"
      - "🧶 Alfombra"
      - "🪑 Sillas"
      - "✨ Varias cosas"

  - id: service_detail
    prompt: "Perfecto. Cuéntame el tamaño o cantidad aproximada. Ej.: sofá de 3 cuerpos, 6 sillas o colchón queen."
    type: text
    required: true

  - id: district
    prompt: "¿En qué distrito está el servicio?"
    type: text
    required: true

  - id: photo_received
    prompt: "📸 Envíame una foto si puedes. Nos ayuda a darte una cotización mucho más precisa."
    type: media_optional
    required: false

  - id: pain_point
    prompt: "¿Qué te gustaría resolver principalmente?"
    type: options
    required: false
    options:
      - "Mancha visible"
      - "Suciedad acumulada"
      - "Olor"
      - "Mantenimiento"
      - "Mascota / niños"
      - "Otro"

  - id: urgency
    prompt: "¿Para cuándo te gustaría hacerlo?"
    type: options
    required: true
    options:
      - "Hoy / mañana"
      - "Esta semana"
      - "Próxima semana"
      - "Solo estoy cotizando"

qualification:
  required_fields:
    - service_type
    - service_detail
    - district
    - urgency
  preferred_fields:
    - photo_received
    - pain_point

handoff:
  state: QUALIFIED_PENDING_QUOTE
  message: "¡Listo! Ya tengo lo necesario 🙌. Una persona de LimpiaFast revisará tu caso y te confirmará precio y horarios disponibles. No tendrás que repetir la información."
  target_human_sla_minutes: 5

attribution:
  capture_from_click_to_whatsapp_referral:
    - source_id
    - source_url
    - headline
    - body
    - ctwa_clid

tracking_fields:
  - lead_id
  - timestamp
  - phone_or_contact_id
  - campaign_name
  - adset_name
  - ad_name
  - source_ad_id
  - ctwa_clid
  - service_type
  - service_detail
  - district
  - pain_point
  - urgency
  - photo_received
  - lead_status
  - quoted_price
  - booked
  - booking_date
  - revenue
  - direct_cost
  - lost_reason

implementation:
  executable_mirror: "src/lib/flow.js"
  webhook: "api/whatsapp.js"
  persistence: "src/lib/storage.js"
  dashboard: "api/dashboard.js"
